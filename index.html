
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Feliz Aniversário, Pedro Jânio!</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    min-height: 100vh;
    overflow-x: hidden;
    font-family: 'Trebuchet MS', sans-serif;
    background: linear-gradient(135deg, #180609, #650d1c, #bd152c);
    color: white;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 25px;
}

/* Bolinhas do tema Ladybug */
body::before {
    content: "";
    position: fixed;
    inset: 0;
    background-image: radial-gradient(#ffccd2 3px, transparent 4px);
    background-size: 65px 65px;
    opacity: .12;
    pointer-events: none;
}

.container {
    position: relative;
    z-index: 2;
    width: 100%;
    max-width: 650px;
    padding: 35px 25px;
    border: 2px solid rgba(255,255,255,.3);
    border-radius: 25px;
    background: rgba(20, 0, 5, .75);
    box-shadow: 0 0 35px #ff244b88;
    animation: aparecer 1.5s ease;
}

h1 {
    color: #ff435e;
    font-size: clamp(30px, 7vw, 45px);
    text-shadow: 0 0 15px #ff163c;
    animation: brilho 2s infinite alternate;
}

.subtitulo {
    margin: 18px 0;
    font-size: 18px;
    color: #ffd9df;
}

.mascote {
    font-size: 75px;
    margin: 20px;
    animation: flutuar 3s ease-in-out infinite;
}

button {
    padding: 16px 30px;
    border: none;
    border-radius: 40px;
    background: #ed1838;
    color: white;
    font-size: 17px;
    font-weight: bold;
    cursor: pointer;
    box-shadow: 0 0 20px #ff244b;
    transition: .3s;
}

button:hover {
    transform: scale(1.1);
    background: #ff4560;
}

#surpresa {
    display: none;
    margin-top: 30px;
    animation: subir 1.2s ease;
}

#surpresa h2 {
    color: #ff7186;
    margin-bottom: 20px;
}

#mensagem {
    white-space: pre-wrap;
    line-height: 1.8;
    font-size: 17px;
    color: #fff0f2;
}

.assinatura {
    margin-top: 25px;
    color: #ff8093;
    font-style: italic;
}

.decoracao {
    position: fixed;
    font-size: 25px;
    pointer-events: none;
    animation: cair linear infinite;
    z-index: 1;
}

.coracao {
    position: fixed;
    animation: subirCoracao 5s linear infinite;
    pointer-events: none;
}

@keyframes aparecer {
    from { opacity: 0; transform: scale(.7); }
    to { opacity: 1; transform: scale(1); }
}

@keyframes subir {
    from { opacity: 0; transform: translateY(35px); }
    to { opacity: 1; transform: translateY(0); }
}

@keyframes brilho {
    from { text-shadow: 0 0 5px #ff244b; }
    to { text-shadow: 0 0 25px #ff244b, 0 0 40px #ff7588; }
}

@keyframes flutuar {
    0%, 100% { transform: translateY(0) rotate(-5deg); }
    50% { transform: translateY(-15px) rotate(5deg); }
}

@keyframes cair {
    from { transform: translateY(-10vh) rotate(0deg); }
    to { transform: translateY(110vh) rotate(360deg); }
}

@keyframes subirCoracao {
    from { transform: translateY(110vh) scale(.5); opacity: 0; }
    20% { opacity: 1; }
    to { transform: translateY(-10vh) scale(1.5); opacity: 0; }
}
</style>
</head>

<body>

<div class="container">

    <div class="mascote">🐞🎨</div>

    <h1>Feliz Aniversário!</h1>

    <p class="subtitulo">
        Hoje o dia é todo seu, Pedro Jânio! ❤️
    </p>

    <p style="margin-bottom: 25px;">
        Preparei uma pequena surpresa especialmente para você...
    </p>

    <button onclick="abrirSurpresa()">
        🎁 Abrir minha surpresa!
    </button>

    <div id="surpresa">
        <h2>✨ Uma mensagem especial para você! ✨</h2>

        <p id="mensagem">
            ESCREVA SUA MENSAGEM AQUI!
        </p>

        <p class="assinatura">
            Com carinho! ❤️
        </p>
    </div>

</div>

<script>

// ABRIR SURPRESA
function abrirSurpresa() {
    document.getElementById("surpresa").style.display = "block";

    document.querySelector("button").style.display = "none";

    soltarConfetes();
}

// CONFETES
function soltarConfetes() {
    for (let i = 0; i < 80; i++) {
        let confete = document.createElement("div");

        confete.className = "decoracao";

        let emojis = ["❤️", "🐞", "✨", "🎨", "🎉", "⭐"];

        confete.innerHTML = emojis[
            Math.floor(Math.random() * emojis.length)
        ];

        confete.style.left = Math.random() * 100 + "vw";
        confete.style.animationDuration =
            (3 + Math.random() * 5) + "s";

        confete.style.animationDelay =
            Math.random() * 3 + "s";

        document.body.appendChild(confete);

        setTimeout(() => confete.remove(), 9000);
    }
}

// CORAÇÕES FLUTUANTES
setInterval(() => {
    let coracao = document.createElement("div");

    coracao.className = "coracao";
    coracao.innerHTML = "❤️";

    coracao.style.left = Math.random() * 100 + "vw";
    coracao.style.bottom = "-30px";
    coracao.style.fontSize = (15 + Math.random() * 25) + "px";

    document.body.appendChild(coracao);

    setTimeout(() => coracao.remove(), 5000);

}, 700);

</script>

</body>
</html>
